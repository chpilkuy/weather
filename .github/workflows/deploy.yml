name: 기상청 예보 받아서 배포

on:
  schedule:
    - cron: '50 * * * *'   # 매시 50분 (기상청 자료가 나온 뒤)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 기상청 예보 받기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: node scripts/kma.mjs
      - name: 올릴 파일 모으기
        run: |
          mkdir _site
          cp index.html manifest.webmanifest kma.json *.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
